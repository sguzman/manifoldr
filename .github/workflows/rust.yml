name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Temporary formatting diagnostic; revert to a strict check after applying the result.
      - name: Format and report sources
        run: |
          cargo fmt --all
          for file in src/main.rs src/cli/mod.rs src/api/client.rs src/api/models.rs src/utils.rs src/tests.rs; do
            printf 'FORMATSTART:%s\n' "$file"
            base64 -w0 "$file"
            printf '\nFORMATEND:%s\n' "$file"
          done
      - name: Static analysis
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: CLI help
        run: cargo run --locked -- --help
