name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Static analysis
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: CLI help
        run: |
          cargo run --locked -- --help
          cargo run --locked -- bet list --help
          cargo run --locked -- bet cancel --help
          cargo run --locked -- market sell --help
      - name: Local cancellation preview (no network)
        run: cargo run --locked -- bet cancel SAMPLE123
      - name: Local share-sale preview (no network)
        run: cargo run --locked -- market sell SAMPLE123 --outcome YES --shares 1.5
      - name: Public smoke — market list (best effort)
        continue-on-error: true
        run: cargo run --locked -- --json market list --limit 1 > /dev/null
      - name: Public smoke — user list (best effort)
        continue-on-error: true
        run: cargo run --locked -- --json user list --limit 1 > /dev/null
      - name: Public smoke — open limit bets (best effort)
        continue-on-error: true
        run: cargo run --locked -- --json bet list --open-limit --limit 1 > /dev/null
      - name: Public smoke — topic list (best effort)
        continue-on-error: true
        run: cargo run --locked -- topic list > /dev/null
