name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format diagnostic and emit formatted source
        run: |
          cargo fmt --all
          for file in src/lib.rs src/main.rs src/api/client.rs src/cli/mod.rs src/utils.rs tests/http_contract.rs; do
            echo "FORMATSTART:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATEND:$file"
          done
      - name: Static analysis
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: CLI help
        run: cargo run --locked -- --help
      - name: Public API read-only smoke
        continue-on-error: true
        run: cargo run --locked -- --json market list --limit 1
