name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Static analysis
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: CLI help
        run: cargo run --locked -- --help
      - name: Public smoke — market list (best effort)
        continue-on-error: true
        run: cargo run --locked -- --json market list --limit 1 > /dev/null
      - name: Public smoke — user list (best effort)
        continue-on-error: true
        run: cargo run --locked -- --json user list --limit 1 > /dev/null
      - name: Public smoke — topic list (best effort)
        continue-on-error: true
        run: cargo run --locked -- topic list > /dev/null
