name: Linux Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify and build
        run: |
          cargo test --locked --all-targets
          cargo build --release --locked
      - name: Package binary and SHA256
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/manifoldr-linux-x86_64.tar.gz manifoldr
          cd dist
          sha256sum manifoldr-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manifoldr-linux-x86_64
          path: dist/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Manifoldr $GITHUB_REF_NAME" --generate-notes
