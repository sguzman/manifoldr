name: Linux Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --release --locked
      - name: Package binary and SHA256
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/manifoldr-linux-x86_64.tar.gz manifoldr
          cd dist
          sha256sum manifoldr-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manifoldr-linux-x86_64
          path: dist/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Manifoldr $GITHUB_REF_NAME" --generate-notes
      - name: Publish vetted v0.2.0 release once from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -q '^version = "0.2.0"' Cargo.toml
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already released; no replacement performed"
          else
            gh release create v0.2.0 dist/* --target "$GITHUB_SHA" --title "Manifoldr v0.2.0" --generate-notes
          fi
