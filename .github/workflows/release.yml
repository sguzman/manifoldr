name: Linux Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --release --locked
      - name: Package binary and SHA256
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/manifoldr-linux-x86_64.tar.gz manifoldr
          cd dist
          sha256sum manifoldr-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manifoldr-linux-x86_64
          path: dist/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Manifoldr $GITHUB_REF_NAME" --generate-notes
      - name: Publish verified version once from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$VERSION"
          case "$VERSION" in
            *[!0-9.]*|'') echo "Invalid package version"; exit 1 ;;
          esac
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; existing release will not be replaced"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Manifoldr $TAG" --generate-notes
          fi
